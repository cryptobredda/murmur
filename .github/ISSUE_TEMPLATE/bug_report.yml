name: Bug report
description: Report a reproducible problem with non-sensitive examples.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Keep keys, signing files, personal audio, and private screenshots out of public issues. Use SECURITY.md for vulnerabilities."
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 0.7.0-test
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Speech, writing, and affected app
      description: Include local/cloud configuration, without credentials.
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected behaviour, and actual behaviour
      description: Distinguish raw recognition from writing changes. Use fictional text.
    validations:
      required: true
